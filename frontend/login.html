<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sign In | HealthBot GH</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-page">

  <main class="auth-container">

    <section class="auth-brand">
      <div class="brand-mark"></div>

      <div>
        <h1>HealthBot GH</h1>
        <p>AI health information for Ghana</p>
      </div>
    </section>

    <section class="auth-box">

      <div class="auth-heading">
        <span>WELCOME BACK</span>

        <h2>Sign in</h2>

        <p>
          Sign in to continue your HealthBot GH
          conversations.
        </p>
      </div>

      <form id="loginForm">

        <div class="auth-field">
          <label for="email">Email address</label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="auth-field">
          <label for="password">Password</label>

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

          <a
            class="auth-forgot-link"
            href="forgot-password.html"
          >Forgot password?</a>
        </div>

        <p
          id="authMessage"
          class="auth-message"
        ></p>

        <button
          id="loginButton"
          class="auth-button"
          type="submit"
        >
          Sign in
        </button>

      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="register.html">Create an account</a>
      </p>

      <p class="auth-disclaimer">
        HealthBot GH provides general health information
        only and does not replace professional medical care.
      </p>

    </section>

  </main>

  <script type="module">
    import {
      loginUser
    } from "./auth.js";

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("authMessage");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent = "";
      message.className = "auth-message";

      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        await loginUser(email, password);

        message.textContent =
          "Signed in successfully.";

        message.classList.add("success");

        setTimeout(() => {
          window.location.href = "index.html";
        }, 500);

      } catch (error) {
        console.error("Login error:", error);

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          message.textContent =
            "Incorrect email or password.";
        } else if (
          error.code === "auth/invalid-email"
        ) {
          message.textContent =
            "Please enter a valid email address.";
        } else if (
          error.code === "auth/too-many-requests"
        ) {
          message.textContent =
            "Too many attempts. Please wait and try again.";
        } else {
          message.textContent =
            "Unable to sign in. Please try again.";
        }

        message.classList.add("error");

        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
  </script>

</body>
</html>
